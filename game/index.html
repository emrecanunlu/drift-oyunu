<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; font-family: system-ui, sans-serif; color: #fff; }
      #app canvas { display: block; }
      #pairing { position: fixed; left: 24px; bottom: 24px; display: none; flex-direction: column; align-items: center; gap: 6px;
        background: rgba(0,0,0,.55); padding: 14px; border-radius: 12px; font-size: 14px; }
      #pairing img { border-radius: 6px; }
      #pairing code { opacity: .7; font-size: 12px; }
      #hud { position: fixed; right: 28px; top: 22px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
      #hud .total { font-size: 34px; font-weight: 700; }
      #hud .best { font-size: 13px; opacity: .7; }
      #hud .combo { margin-top: 8px; font-size: 22px; color: #ffd27a; transition: opacity .2s; }
      #hud .mult { font-size: 28px; font-weight: 800; color: #ff8a5c; margin-left: 6px; }
      #hud .speed { margin-top: 10px; font-size: 14px; opacity: .7; }
      #stale { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 26px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none; }
      #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #combo { --c: #fff; position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); display: flex; flex-direction: column;
        align-items: center; opacity: 0; transition: opacity .25s; pointer-events: none; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
      #combo .label { font-size: 34px; font-weight: 900; letter-spacing: 6px; color: var(--c); font-style: italic; }
      #combo .ring { position: relative; width: 140px; height: 140px; margin: 4px 0; }
      #combo svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      #combo circle { fill: rgba(0,0,0,.35); stroke-width: 7; }
      #combo .bg { stroke: rgba(255,255,255,.15); }
      #combo .fg { fill: none; stroke: var(--c); stroke-linecap: round; filter: drop-shadow(0 0 6px var(--c)); }
      #combo .mult { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 58px; font-weight: 900; color: var(--c); }
      #combo .pts { font-size: 44px; font-weight: 800; }
      #combo.pop { animation: pop .35s cubic-bezier(.2,1.8,.4,1); }
      #combo.shake { animation: shake .45s; }
      #combo.lost { --c: #ff4a4a; opacity: 0 !important; transition: opacity .9s .3s; }
      @keyframes pop { 0% { transform: translateX(-50%) scale(1.6); } 100% { transform: translateX(-50%) scale(1); } }
      @keyframes shake { 0%,100% { transform: translateX(-50%); } 20% { transform: translateX(calc(-50% - 14px)); }
        40% { transform: translateX(calc(-50% + 12px)); } 60% { transform: translateX(calc(-50% - 8px)); } 80% { transform: translateX(calc(-50% + 5px)); } }
      #glow { --c: #fff; position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 20px var(--c); }
      #glow.flash { animation: flash .5s ease-out; }
      @keyframes flash { 0% { opacity: .7; } 100% { opacity: 0; } }
      .fly { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); font-size: 40px; font-weight: 900;
        text-shadow: 0 3px 12px rgba(0,0,0,.5); pointer-events: none; transition: all .75s cubic-bezier(.5,0,.8,.4); }
      .fly.go { left: calc(100% - 90px); bottom: calc(100% - 60px); font-size: 20px; opacity: 0; }
      #hud .total.pulse { animation: tpulse .4s; }
      @keyframes tpulse { 0% { transform: scale(1.35); color: #ffd27a; } 100% { transform: scale(1); } }
      #hud .total { transform-origin: right center; }
      #biome { position: fixed; top: 22%; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 800;
        letter-spacing: 3px; text-shadow: 0 3px 14px rgba(0,0,0,.55); opacity: 0; transition: opacity .8s; pointer-events: none; }
      #sound { position: fixed; left: 24px; top: 20px; padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
        background: rgba(0,0,0,.55); color: #fff; font-size: 15px; }
      #hint { position: fixed; left: 24px; top: 64px; font-size: 12px; opacity: .6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="stale">Kontrolcü bağlantısı koptu</div>
    <div id="flash"></div>
    <div id="pairing"></div>
    <div id="biome"></div>
    <div id="glow"></div>
    <div id="combo">
      <div class="label"></div>
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44" /><circle class="fg" cx="50" cy="50" r="44" /></svg>
        <div class="mult"></div>
      </div>
      <div class="pts"></div>
    </div>
    <button id="sound">🔊 Sesi aç</button>
    <div id="hint">M: sesi kapat/aç</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
