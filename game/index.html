<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; font-family: system-ui, sans-serif; color: #fff; }
      #app canvas { display: block; }
      #pairing { position: fixed; left: 24px; bottom: 24px; display: none; flex-direction: column; align-items: center; gap: 6px;
        background: rgba(0,0,0,.55); padding: 14px; border-radius: 12px; font-size: 14px; }
      #pairing img { border-radius: 6px; }
      #pairing code { opacity: .7; font-size: 12px; }
      #hud { position: fixed; right: 28px; top: 22px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
      #hud .total { font-size: 34px; font-weight: 700; }
      #hud .best { font-size: 13px; opacity: .7; }
      #hud .combo { margin-top: 8px; font-size: 22px; color: #ffd27a; transition: opacity .2s; }
      #hud .mult { font-size: 28px; font-weight: 800; color: #ff8a5c; margin-left: 6px; }
      #hud .speed { margin-top: 10px; font-size: 14px; opacity: .7; }
      #stale { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 26px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none; }
      #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #combo { --c: #fff; position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: 5%; display: flex; flex-direction: column;
        align-items: center; opacity: 0; pointer-events: none; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
      #combo .label { font-size: 34px; font-weight: 900; letter-spacing: 6px; color: var(--c); font-style: italic; }
      #combo .ring { position: relative; width: 140px; height: 140px; margin: 4px 0; }
      #combo svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
      #combo circle { fill: rgba(0,0,0,.35); stroke-width: 7; }
      #combo .bg { stroke: rgba(255,255,255,.15); }
      #combo .fg { fill: none; stroke: var(--c); stroke-linecap: round; filter: drop-shadow(0 0 6px var(--c)); }
      #combo .mult { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 58px; font-weight: 900; color: var(--c); }
      #combo .pts { font-size: 44px; font-weight: 800; }
      #combo.lost { --c: #ff4a4a; }
      #combo .ring { animation: beat var(--beat, .9s) ease-in-out infinite; }
      @keyframes beat { 50% { transform: scale(var(--beatScale, 1)); } }
      #lines { position: fixed; inset: -20%; pointer-events: none; opacity: 0; mix-blend-mode: screen;
        background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0deg 1.2deg, transparent 1.2deg 9deg);
        -webkit-mask-image: radial-gradient(circle, transparent 38%, #000 70%); mask-image: radial-gradient(circle, transparent 38%, #000 70%);
        animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #vignette { --c: #000; position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, color-mix(in srgb, var(--c) 35%, #000) 100%); }
      #xhint { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); display: none; padding: 12px 22px; border-radius: 12px;
        font-size: 20px; font-weight: 800; background: linear-gradient(90deg,#ff2a3a,#ff8a2a); box-shadow: 0 0 24px #ff3a2a; pointer-events: none; }
      #countdown { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 160px;
        font-weight: 900; font-style: italic; text-shadow: 0 6px 30px rgba(0,0,0,.6); pointer-events: none; }
      #police { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #glow { --c: #fff; position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 20px var(--c); }
      .fly { position: fixed; font-size: 40px; font-weight: 900; translate: -50% 0;
        text-shadow: 0 3px 12px rgba(0,0,0,.5); pointer-events: none; }
      #hud .total { transform-origin: right center; }
      #extreme { position: fixed; right: 28px; top: 132px; display: none; padding: 6px 14px; border-radius: 8px; font-weight: 900;
        letter-spacing: 3px; font-style: italic; background: linear-gradient(90deg,#ff2a3a,#ff8a2a); box-shadow: 0 0 18px #ff3a2a; }
      #biome { position: fixed; top: 42%; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 800;
        letter-spacing: 3px; text-shadow: 0 3px 14px rgba(0,0,0,.55); opacity: 0; transition: opacity .8s; pointer-events: none; }
      #sound { position: fixed; left: 24px; top: 20px; padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
        background: rgba(0,0,0,.55); color: #fff; font-size: 15px; }
      #hint { position: fixed; left: 24px; top: 64px; font-size: 12px; opacity: .6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="stale">Kontrolcü bağlantısı koptu</div>
    <div id="flash"></div>
    <div id="pairing"></div>
    <div id="biome"></div>
    <div id="extreme">EXTREME</div>
    <div id="vignette"></div>
    <div id="lines"></div>
    <div id="glow"></div>
    <div id="xhint">🔥 EXTREME modu dene! Telefonda <b>EXTREME</b>'e bas ya da klavyede <b>E</b></div>
    <div id="police"></div>
    <div id="countdown"></div>
    <div id="combo">
      <div class="label"></div>
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44" /><circle class="fg" cx="50" cy="50" r="44" /></svg>
        <div class="mult"></div>
      </div>
      <div class="pts"></div>
    </div>
    <button id="sound">🔊 Sesi aç</button>
    <div id="hint">M: sesi kapat/aç</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
